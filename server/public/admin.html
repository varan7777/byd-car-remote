<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Remote — Адмінка</title>
<style>
  :root { --bg:#0b0b0d; --card:#1c1c1e; --txt:#fff; --mut:#98989f; --acc:#ff7a1a; --ok:#30d158; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 -apple-system,system-ui,sans-serif; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:18px; overflow:auto; }
  h2 { font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #ffffff14; white-space:nowrap; }
  th { color:var(--mut); font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .on { background:var(--ok); } .off { background:#555; }
  .acc { color:var(--acc); }
</style>
</head>
<body>
  <h1>Car Remote <span class="acc">· Адмінка</span></h1>
  <p class="sub">Привʼязані авто та останні команди. Кожне авто бачить лише свій власник.</p>

  <div class="card">
    <h2>Авто</h2>
    <table id="cars"><thead><tr><th>#</th><th>Статус</th><th>Власник</th><th>Телефон</th><th>Остання активність</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Команди (останні)</h2>
    <table id="logs"><thead><tr><th>Час</th><th>Авто</th><th>Напрям</th><th>Текст</th></tr></thead><tbody></tbody></table>
  </div>

<script>
const fmt = (ts) => ts ? new Date(ts).toLocaleString('uk-UA') : '—';
async function load() {
  const cars = await (await fetch('api/cars')).json();
  document.querySelector('#cars tbody').innerHTML = cars.map(c =>
    `<tr><td>${c.id}</td>
      <td><span class="dot ${c.online?'on':'off'}"></span>${c.online?'онлайн':'офлайн'}</td>
      <td>${c.owner||'—'}</td><td>${c.phone||'—'}</td><td>${fmt(c.lastSeen)}</td></tr>`).join('');
  const logs = await (await fetch('api/logs')).json();
  document.querySelector('#logs tbody').innerHTML = logs.map(l =>
    `<tr><td>${fmt(l.ts)}</td><td>#${l.car_id}</td><td>${l.direction==='in'?'→ авто':'← власник'}</td><td>${(l.text||'').slice(0,80)}</td></tr>`).join('');
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
