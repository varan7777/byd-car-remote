# HOST HTTPS-vhost varan.team, not .htaccess or the restricted website container.
# Requires proxy, proxy_http, proxy_wstunnel, headers. Hub binds host loopback only.
# If Apache is containerized, the hosting admin must provide/firewall a private upstream.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass        /admin/ http://127.0.0.1:8080/admin/
ProxyPassReverse /admin/ http://127.0.0.1:8080/admin/
ProxyPass        /admin  http://127.0.0.1:8080/admin
ProxyPassReverse /admin  http://127.0.0.1:8080/admin
ProxyPass        /api/   http://127.0.0.1:8080/api/
ProxyPassReverse /api/   http://127.0.0.1:8080/api/
ProxyPass        /media/ http://127.0.0.1:8080/media/
ProxyPassReverse /media/ http://127.0.0.1:8080/media/
ProxyPass        /tg/    http://127.0.0.1:8080/tg/
ProxyPassReverse /tg/    http://127.0.0.1:8080/tg/
ProxyPass        /car    ws://127.0.0.1:8080/car
ProxyPassReverse /car    ws://127.0.0.1:8080/car
